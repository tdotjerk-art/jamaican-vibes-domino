name: Dependency security audit

on:
  push:
    branches: [fix/dependency-security-audit]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Apply only compatible lockfile security patches
        run: |
          npm audit fix --package-lock-only
          npm ci
          npm audit --audit-level=moderate
          npm test
      - name: Save reviewed dependency lockfile on audit branch
        run: |
          if git diff --quiet -- package-lock.json; then
            echo "No lockfile updates required"
          else
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add package-lock.json
            git commit -m "Patch vulnerable transitive npm dependency lockfile"
            git push origin HEAD:fix/dependency-security-audit
          fi
