name: Credit release-readiness audit

on:
  push:
    branches: [feature/domino-credit-wallet-pilot]
    paths:
      - package-lock.json
      - package.json
      - server.js
      - docs/domino-credit-release-checklist.md
      - scripts/check-credit-release-gate.cjs
      - .github/workflows/domino-credit-release-audit.yml
      - test/domino-credit-gate-mode.test.js
  workflow_dispatch:

jobs:
  safety:
    runs-on: ubuntu-24.04
    timeout-minutes: 7
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - name: Zero moderate-or-higher npm advisories
        run: npm audit --audit-level=moderate
      - name: Credit launch safety tests
        run: node --test test/domino-credit-launch-safety.test.js test/domino-wallet-sqlite.test.js

  credit-readiness-report:
    runs-on: ubuntu-24.04
    needs: safety
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Report unmet release requirements (not approval)
        run: node scripts/check-credit-release-gate.cjs --audit-only
      - name: Verify the production launch gate still refuses incomplete releases
        run: node --test test/domino-credit-gate-mode.test.js
